# d2x-cios-ftp: builds the cIOS modules (as upstream) and runs the host
# tests of the FTP backend (tools/net-test) against a local FTP server.
name: Build cIOS

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/**/*.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test FTP backend on the host
        run: |
          pip install pyftpdlib
          tools/net-test/run-tests.sh

      - name: Download devkitARM r32
        run: |
          wget "https://github.com/Leseratte10/compile-devkitARM-r32/releases/download/2020-02-20/devkitARM-r32-linux_debian-buster.tar.gz"
          tar -xf devkitARM-r32-linux_debian-buster.tar.gz -C /opt
          rm devkitARM-r32-linux_debian-buster.tar.gz

      - name: Compile stripios
        run: |
          cd stripios_src
          g++ main.cpp -o stripios
          cp stripios ..

      - name: Compile cIOS
        run: |
          # gawk is needed by replace.awk (rshift/and), mawk can't run it
          sudo apt-get install -y libfl2 gawk
          chmod +x maked2x.sh
          ./maked2x.sh 11 ftp
          echo "upload_name=v11-ftp-$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with: 
          name: d2x-cios-ftp-${{ env.upload_name }}
          path: build
